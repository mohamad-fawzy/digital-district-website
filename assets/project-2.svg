    <g stroke="#8B93A3" stroke-width="1" opacity="0.7">
      <line x1="0" y1="26" x2="500" y2="26"/>
      <line x1="0" y1="52" x2="500" y2="52"/>
      <line x1="0" y1="78" x2="500" y2="78"/>
      <line x1="0" y1="104" x2="500" y2="104"/>
      <line x1="0" y1="130" x2="500" y2="130"/>
      <line x1="42" y1="0" x2="42" y2="160"/>
      <line x1="125" y1="0" x2="125" y2="160"/>
      <line x1="208" y1="0" x2="208" y2="160"/>
      <line x1="291" y1="0" x2="291" y2="160"/>
      <line x1="374" y1="0" x2="374" y2="160"/>
