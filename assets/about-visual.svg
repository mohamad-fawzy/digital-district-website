<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#1C2531"/>
    </linearGradient>
    <pattern id="grid4" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8B93A3" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="640" height="800" fill="url(#bg4)"/>
  <rect width="640" height="800" fill="url(#grid4)"/>
  <!-- vertical machine schematic -->
  <g transform="translate(120,220)" fill="none" stroke="#C41E3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="400" height="360" rx="6"/>
    <line x1="0" y1="90" x2="400" y2="90" stroke="#4A5262" stroke-width="1.2"/>
    <line x1="0" y1="180" x2="400" y2="180" stroke="#4A5262" stroke-width="1.2"/>
    <line x1="0" y1="270" x2="400" y2="270" stroke="#4A5262" stroke-width="1.2"/>
    <circle cx="60" cy="45" r="18" stroke="#8B93A3" stroke-width="1.5"/>
    <circle cx="340" cy="45" r="18" stroke="#8B93A3" stroke-width="1.5"/>
    <rect x="150" y="140" width="100" height="80" stroke="#E8E4D9" stroke-width="1.5"/>
    <path d="M40 320 L360 320" stroke-dasharray="6 6"/>
  </g>
  <text x="320" y="140" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="3" fill="#C41E3A">SPEC / MACHINE LAYOUT</text>
  <text x="320" y="680" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="2" fill="#8B93A3">REV. A — DIGITAL DISTRICT ENGINEERING</text>
</svg>
