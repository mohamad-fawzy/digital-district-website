<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C2531"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B93A3" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <rect width="800" height="600" fill="url(#grid3)"/>
  <!-- Piping / structural framework illustration -->
  <g transform="translate(120,150)" fill="none" stroke="#C41E3A" stroke-width="2.5" stroke-linecap="round">
    <path d="M0 300 L0 60 L560 60 L560 300"/>
    <path d="M140 60 L140 300" stroke="#4A5262" stroke-width="1.5"/>
    <path d="M280 60 L280 300" stroke="#4A5262" stroke-width="1.5"/>
    <path d="M420 60 L420 300" stroke="#4A5262" stroke-width="1.5"/>
    <circle cx="0" cy="60" r="7" fill="#C41E3A" stroke="none"/>
    <circle cx="560" cy="60" r="7" fill="#C41E3A" stroke="none"/>
    <circle cx="140" cy="60" r="5" fill="#8B93A3" stroke="none"/>
    <circle cx="280" cy="60" r="5" fill="#8B93A3" stroke="none"/>
    <circle cx="420" cy="60" r="5" fill="#8B93A3" stroke="none"/>
  </g>
  <text x="400" y="140" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="3" fill="#C41E3A">CONTRACTING / STRUCTURAL FRAME</text>
</svg>
