<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C2531"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B93A3" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <rect width="800" height="600" fill="url(#grid1)"/>
  <!-- Conveyor belt illustration -->
  <g transform="translate(100,320)">
    <rect x="0" y="0" width="600" height="14" rx="7" fill="#2A3341" stroke="#C41E3A" stroke-width="1.5"/>
    <circle cx="20" cy="7" r="24" fill="none" stroke="#C41E3A" stroke-width="2.5"/>
    <circle cx="580" cy="7" r="24" fill="none" stroke="#C41E3A" stroke-width="2.5"/>
    <g stroke="#4A5262" stroke-width="1.5">
      <line x1="60" y1="7" x2="60" y2="70"/>
      <line x1="180" y1="7" x2="180" y2="70"/>
      <line x1="300" y1="7" x2="300" y2="70"/>
      <line x1="420" y1="7" x2="420" y2="70"/>
      <line x1="540" y1="7" x2="540" y2="70"/>
    </g>
    <!-- packages on belt -->
    <rect x="90" y="-30" width="46" height="30" rx="3" fill="#E8E4D9"/>
    <rect x="230" y="-30" width="46" height="30" rx="3" fill="#E8E4D9"/>
    <rect x="370" y="-30" width="46" height="30" rx="3" fill="#E8E4D9"/>
    <rect x="470" y="-30" width="46" height="30" rx="3" fill="#C41E3A" opacity="0.85"/>
  </g>
  <text x="400" y="140" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="3" fill="#C41E3A">FOOD-LINE / 12M CONVEYOR</text>
</svg>
